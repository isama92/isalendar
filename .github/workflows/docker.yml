name: docker

# Pull requests (and manual runs on other branches) build without pushing. A merge to
# main builds the same image and pushes it as :latest. Both share a buildx cache scope.
# Nothing publishes from a pull request: a fork must not be able to move :latest.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
    # None of these can change the image, and republishing would move :latest to a new
    # digest for nothing. Use workflow_dispatch to publish deliberately.
    paths-ignore:
      - '**.md'
      - .github/dependabot.yml
      - .github/workflows/autofix.yml
      - .github/workflows/code-quality.yml
      - .github/workflows/tests.yml
      - .github/workflows/updates.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never abandon a half-finished push.
  cancel-in-progress: false

jobs:
  image:
    name: Build${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && ' and push' || '' }} the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || ! github.event.pull_request.draft

    permissions:
      contents: read
      # Only used on the push path, but permissions cannot be set per step.
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Schema and interpolation check only. The .env is a throwaway copy of the example,
      # because compose treats a missing env_file as a hard error.
      - name: Validate compose.production.yml
        run: |
          cp .env.production.example .env
          docker compose -f compose.production.yml config -q
          rm -f .env

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Derived rather than hardcoded so a fork publishes into its own namespace.
          images: ghcr.io/${{ github.repository }}
          # A single moving tag, matching compose.production.yml. Roll back by pinning a
          # digest from this run's log.
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.title=isalendar

      - name: Build${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=isalendar
          cache-to: type=gha,mode=max,scope=isalendar
