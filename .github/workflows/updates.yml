# Weekly dependency updates, as a pull request.
#
# `composer update` and `npm update` only move the lock files. `composer bump` and
# `npm-check-updates --target semver` raise the floors in composer.json and package.json
# to match, so declared and installed versions do not drift apart. None of these cross a
# major version; that stays a manual decision.
name: automatic updates

on:
  schedule:
    # Wednesday 07:00 UTC.
    - cron: '0 7 * * 3'
  workflow_dispatch:

# Wider than every other workflow here: create-pull-request pushes a branch and opens a
# pull request against it.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  updates:
    name: Update dependencies and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Same database setup as tests.yml.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      # Deliberately WITHOUT `persist-credentials: false`: create-pull-request pushes the
      # update branch through the remote this step configures.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pcntl, redis, intl, gd, zip, bcmath, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare environment
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Update Composer dependencies
        run: |
          composer update --no-interaction --no-progress
          composer bump

      # ncu rewrites package.json and reinstalls; `npm update` then settles the lock file
      # for anything ncu left within range.
      - name: Update npm dependencies
        run: |
          npx --yes npm-check-updates -u --target semver --install always
          npm update

      # Built before the checks because the feature tests need the Vite manifest, and
      # because native packages (tailwind oxide, lightningcss) are what an update breaks.
      - name: Build assets
        run: npm run build

      # The only check this pull request gets when it is opened with GITHUB_TOKEN: GitHub
      # does not trigger workflows from events raised by that token.
      - name: Run CI checks
        run: composer ci:check

      - name: Create a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Add an UPDATES_TOKEN secret (fine-grained PAT with contents and pull-requests
          # write, or a GitHub App token) to make tests.yml and friends run on this PR.
          token: ${{ secrets.UPDATES_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: Update dependencies
          branch: update-dependencies
          delete-branch: true
          title: Dependency updates
          body: |
            Automated weekly update of the Composer and npm dependencies.

            `composer update` then `composer bump`, and `npm-check-updates --target
            semver` then `npm update`. Neither ecosystem crosses a major version.

            `npm run build` and `composer ci:check` both passed on this branch before
            this pull request was opened. If no checks are reported below, that is
            expected: see the token comment in `.github/workflows/updates.yml`.
          labels: dependencies
          assignees: isama92
